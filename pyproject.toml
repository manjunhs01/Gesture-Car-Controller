[project]
name = "gesture-car"
version = "2.0.0"
description = "VisionDrive: hand-gesture-controlled car game controller. Silent webcam hand-gesture controller (two-hand steering wheel) for any game: virtual gamepad or keyboard output"
requires-python = ">=3.10"

[tool.ruff]
line-length = 130
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM"]
ignore = ["E501", "B008", "SIM108"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
markers = ["hardware: needs a physical webcam (skipped when none is available)"]

[tool.mypy]
python_version = "3.10"
ignore_missing_imports = true
check_untyped_defs = true
warn_unused_ignores = false
